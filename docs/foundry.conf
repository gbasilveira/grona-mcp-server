# Configuration read by the foundry-protocol scripts (scripts/*.sh). Format KEY=value.
# Integration branch: WOs branch from and integrate into here, or into the gate branch.
BASE_BRANCH=main
# Prefix of the gate branches (gate.sh): <prefix>GNN-<slug>
GATE_BRANCH_PREFIX=gate/
# Canonical verification command (gate.sh and the restart prompt run it)
VERIFY_CMD=npm run verify
# INSTALL_CMD runs before VERIFY_CMD in the fresh gate worktree (e.g. "pnpm install --frozen-lockfile --offline").
# VERIFY_TMPDIR: where that worktree is created (default $TMPDIR).
INSTALL_CMD=npm ci
VERIFY_TMPDIR=
# Gate mode: human (default — a gate in READY FOR REVIEW is a stop until the user approves) or
# autonomous (no human validation: the orchestrator closes the gate with scripts/gate.sh close NN once
# every WO is ACCEPTED and VERIFY_CMD passes; the gate documentation is still mandatory). See ORCHESTRATION.md §2.3.
GATE_MODE=human
